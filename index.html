<!doctype html><html><head><meta charset="utf-8"><title>RC Graphic Designs &amp; Printing</title>
<link rel="stylesheet" href="styles.css"></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="CatalogPage.jsx"></script>
<script type="text/babel" src="ProductPage.jsx"></script>
<script type="text/babel" src="CartPage.jsx"></script>
<script type="text/babel" src="ContactPage.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const {Toast}=window.RCGraphicDesignSystem_084885;
  const [route,setRoute]=React.useState('home');
  const [items,setItems]=React.useState([]);
  const [toast,setToast]=React.useState(null);
  React.useEffect(()=>{window.scrollTo(0,0);},[route]);
  const go=r=>setRoute(r);
  const onAdd=it=>{setItems(x=>[...x,it]);setToast({title:'Added to cart',message:it.qty.toLocaleString()+' business cards · '+it.stock});
    setTimeout(()=>setToast(null),3600);};
  return <div>
    <PromoBar/>
    <Header route={route} go={go} cartCount={items.length}/>
    {route==='home'&&<Home go={go}/>}
    {route==='catalog'&&<CatalogPage go={go}/>}
    {route==='product'&&<ProductPage go={go} onAdd={onAdd}/>}
    {route==='cart'&&<CartPage go={go} items={items} onRemove={i=>setItems(x=>x.filter((_,n)=>n!==i))}/>}
    {route==='contact'&&<ContactPage go={go}/>}
    <Footer go={go}/>
    {toast&&<div style={{position:'fixed',right:'var(--space-6)',bottom:'var(--space-6)',zIndex:50}}>
      <Toast title={toast.title} message={toast.message} onDismiss={()=>setToast(null)}/></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
