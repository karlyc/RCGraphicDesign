<!-- @dsCard group="Colors" viewport="700x150" name="Surface aliases" subtitle="The four surfaces every screen is built from" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
 <div style="height:96px;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px;font:var(--weight-bold) 11px/1.3 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-600)">--surface-page</div>
 <div style="height:96px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:10px;font:var(--weight-bold) 11px/1.3 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-600)">--surface-card</div>
 <div style="height:96px;background:var(--surface-tint);border:1px solid var(--pine-200);border-radius:var(--radius-sm);padding:10px;font:var(--weight-bold) 11px/1.3 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--pine-700)">--surface-tint</div>
 <div style="height:96px;background:var(--surface-dark);border-radius:var(--radius-sm);padding:10px;font:var(--weight-bold) 11px/1.3 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-300)">--surface-dark</div></div>
</body></html>
