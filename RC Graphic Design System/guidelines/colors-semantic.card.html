<!-- @dsCard group="Colors" viewport="700x170" name="Semantic pairs" subtitle="Foreground on its own tinted background — used by Badge, Callout, Toast" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="padding:12px;border-radius:var(--radius-sm);background:var(--status-success-bg)"><div style="font:var(--weight-bold) 12px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--status-success-fg)">Success</div><div style="font:400 11px/1.4 var(--font-mono);color:var(--status-success-fg);margin-top:6px">#2D6A4F<br>#E3F1E9</div></div><div style="padding:12px;border-radius:var(--radius-sm);background:var(--status-warning-bg)"><div style="font:var(--weight-bold) 12px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--status-warning-fg)">Warning</div><div style="font:400 11px/1.4 var(--font-mono);color:var(--status-warning-fg);margin-top:6px">#B4740B<br>#FBF0DA</div></div><div style="padding:12px;border-radius:var(--radius-sm);background:var(--status-error-bg)"><div style="font:var(--weight-bold) 12px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--status-error-fg)">Error</div><div style="font:400 11px/1.4 var(--font-mono);color:var(--status-error-fg);margin-top:6px">#C2321F<br>#FBE6E2</div></div><div style="padding:12px;border-radius:var(--radius-sm);background:var(--status-info-bg)"><div style="font:var(--weight-bold) 12px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--status-info-fg)">Info</div><div style="font:400 11px/1.4 var(--font-mono);color:var(--status-info-fg);margin-top:6px">#0B6E99<br>#E1F1F8</div></div><div style="padding:12px;border-radius:var(--radius-sm);background:var(--status-rush-bg)"><div style="font:var(--weight-bold) 12px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--status-rush-fg)">Rush</div><div style="font:400 11px/1.4 var(--font-mono);color:var(--status-rush-fg);margin-top:6px">#8A5200<br>#FFF6D9</div></div></div>
</body></html>
