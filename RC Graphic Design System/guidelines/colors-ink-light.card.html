<!-- @dsCard group="Colors" viewport="700x150" name="Ink tints & silver" subtitle="Page, sunken and hairline values, plus the logo silver" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--ink-200);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">200 border</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#E2E2E7</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--ink-100);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">100 sunken</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#F1F1F4</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--ink-50);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">50 page</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#F8F8FA</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--white);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">white</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#FFFFFF</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--silver);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">silver</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#A7A8AF</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:54px;background:var(--silver-light);border:1px solid rgba(19,19,22,.1);border-radius:var(--radius-sm)"></div><div style="font:var(--weight-bold) 11px/1.2 var(--font-condensed);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-800)">silver light</div><div style="font:400 11px/1.2 var(--font-mono);color:var(--ink-500)">#C9CAD0</div></div></div>
</body></html>
