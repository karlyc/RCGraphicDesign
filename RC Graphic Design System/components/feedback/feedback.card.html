<body><div id="root"></div>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

function Demo(){return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
 <div className="col">
  <Callout tone="rush" title="Order by 4 PM for next-day printing">Press-ready PDFs only after the cutoff.</Callout>
  <Callout tone="info" title="Add 0.125 in bleed">Keep text 0.25 in inside the trim.</Callout>
  <Callout tone="warning" title="Low-resolution image">Your file is 144 dpi at final size.</Callout>
  <Callout tone="error" title="Missing back side">This card is set up for two-sided print.</Callout>
 </div>
 <div className="col">
  <Toast title="Added to cart" message="500 business cards · 16pt matte" onDismiss={()=>{}}/>

   <span style={{display:'inline-flex',alignItems:'center',gap:6,font:'var(--type-body-sm)'}}>Bleed <Icon name="circle-help" size={14} color="var(--ink-400)"/></span></Tooltip></div>
  <div style={{position:'relative',height:150,border:'1px dashed var(--border-default)',borderRadius:'var(--radius-sm)',overflow:'hidden'}}>
   <div style={{position:'absolute',inset:0,transform:'scale(.62)',transformOrigin:'top left',width:'162%',height:'162%'}}>
    <Dialog eyebrow="Step 2 of 4" title="Upload your artwork" width={420}
     footer={<><Button variant="ghost" size="sm">Cancel</Button><Button size="sm">Continue</Button></>}>

 </div></div>;}
